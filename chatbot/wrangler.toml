# Cloudflare Worker settings for the MVRK website chatbot.
# The Anthropic API key is NOT stored here. It is saved in Cloudflare as a secret:
#   npx wrangler secret put ANTHROPIC_API_KEY
name = "mvrk-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Websites allowed to use this chatbot (comma-separated).
[vars]
ALLOWED_ORIGINS = "https://akib897.github.io,https://mvrk.tv,https://www.mvrk.tv,http://localhost:8080"

# Anti-abuse: at most 10 messages per minute from one visitor (IP address).
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
